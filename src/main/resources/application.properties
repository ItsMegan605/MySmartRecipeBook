spring.application.name=MySmartRecipeBook

#mongoDB connection
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database = MySmartRecipeBookDB

#cluster nodes
app.redis.cluster.nodes=127.0.0.1:7004,127.0.0.1:7005,127.0.0.1:7006
#database index (default = 0)
spring.data.redis.database=0
#spring.data.redis.password


#parameters
app.recipe.pag-size-title=5
app.recipe.pag-size-category=10  
app.recipe.pag-size-home=5  
app.recipe.pag-size-chef=5  
app.recipe.pag-size-foodie=5

app.recipe.do-population=false
app.recipe.do-chef-recipes=false
app.recipe.do-neo4j-population=false
app.recipe.do-redis-population=false
#Neo4j connection
spring.neo4j.uri=bolt://127.0.0.1:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=12345678


app.jwt.secret=MyVeryLongAndSecureJwtSecretKeyThatMustBeAtLeast32Characters
#token duration: 24h
app.jwt.expirationMs=86400000

#exception message
server.error.include-message=always
server.error.include-stacktrace=never

#mongo indexes
spring.data.mongodb.auto-index-creation=true